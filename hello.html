<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      font-family: system-ui, sans-serif;
      background: #ffffff;
      transition: background 0.4s ease;
    }
    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      text-align: center;
      margin: 0 1rem;
    }
    button {
      font-size: 1.25rem;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      background: #222;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Hello from Claude Code</h1>
  <button id="colourBtn">Change colour</button>

  <script>
    document.getElementById('colourBtn').addEventListener('click', () => {
      const colour = '#' + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, '0');
      document.body.style.background = colour;
    });
  </script>
</body>
</html>
